<title>Terrain Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: slim header over a two-part workspace. A tall control rail on the left,
   the live 3D map filling the rest. On phones the map sits on top and the rail scrolls below. */
:root {
  --bg: #e5e9e1;
  --panel: #f1f4ec;
  --raise: #fafcf6;
  --ink: #16231c;
  --muted: #55675b;
  --line: #c8d0c2;
  --accent: #0b7681;
  --accent-ink: #ffffff;
  --accent-soft: #d2e8e6;
  --warn: #a2432b;
  --stage: #a9bcc4;
  --f-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --gx-l: max(16px, env(safe-area-inset-left, 0px));
  --gx-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1315; --panel: #131b1e; --raise: #1a2428; --ink: #e2ebe5; --muted: #8da197;
    --line: #26353b; --accent: #55c9c1; --accent-ink: #04201f; --accent-soft: #1b3a3b;
    --warn: #ef8b6e; --stage: #1c2a30; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1315; --panel: #131b1e; --raise: #1a2428; --ink: #e2ebe5; --muted: #8da197;
  --line: #26353b; --accent: #55c9c1; --accent-ink: #04201f; --accent-soft: #1b3a3b;
  --warn: #ef8b6e; --stage: #1c2a30; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); overflow-x: hidden; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 10px var(--gx-r) 10px var(--gx-l); background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 700 20px/1.1 var(--f-display); letter-spacing: -0.01em; }
.brand .tag { font: 500 11px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--raise); color: var(--ink);
  padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; line-height: 1.2;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: 0.55; cursor: progress; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.main { display: grid; grid-template-columns: minmax(300px, 356px) minmax(0, 1fr); min-height: 0; }
.panel { overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding-block: 12px 28px; min-width: 0; }
.stage { position: relative; min-width: 0; min-height: 0; background: var(--stage); overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 var(--gx-r) 12px var(--gx-l); }
.chip {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 8px 9px; text-align: left;
  border: 1px solid var(--line); border-radius: 6px; background: var(--raise); cursor: pointer; min-width: 0;
}
.chip span.n { font-weight: 600; font-size: 12.5px; }
.chip .sw { display: flex; height: 6px; width: 100%; border-radius: 2px; overflow: hidden; }
.chip .sw i { flex: 1; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }

details.grp { border-top: 1px solid var(--line); }
details.grp > summary {
  list-style: none; cursor: pointer; padding: 11px var(--gx-r) 11px var(--gx-l);
  font: 500 11px var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; align-items: center;
}
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::after { content: '+'; font-size: 15px; }
details.grp[open] > summary::after { content: '\2212'; }
details.grp > .body { display: grid; gap: 12px; padding: 2px var(--gx-r) 16px var(--gx-l); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 8px; }
.row label { font-weight: 500; }
.row output { font: 400 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.row input[type=range] { grid-column: 1 / -1; width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
.row select, .row input[type=text] {
  grid-column: 1 / -1; width: 100%; padding: 7px 9px; background: var(--raise); border: 1px solid var(--line); border-radius: 6px;
}
.seedrow { grid-column: 1 / -1; display: flex; gap: 6px; }
.seedrow input { flex: 1; min-width: 0; padding: 7px 9px; background: var(--raise); border: 1px solid var(--line); border-radius: 6px; font-family: var(--f-mono); }
.tog { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.tog input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.togs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; }
.note { margin: 0; font-size: 12px; color: var(--muted); }

.hud-tr { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; }
.hud-tr .btn { padding: 6px 10px; font-size: 12px; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(6px); }
.hud-bl {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; max-width: calc(100% - 24px);
  padding: 9px 12px; border-radius: 6px; font: 400 11.5px/1.55 var(--f-mono); font-variant-numeric: tabular-nums;
  background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(6px); border: 1px solid var(--line);
  pointer-events: none;
}
.hud-bl b { font-weight: 500; color: var(--accent); }
.busy {
  position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--stage) 55%, transparent);
  font: 500 12px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; pointer-events: none;
}
.busy span { background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 6px; }
.toast {
  position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 6px; font-size: 13px; text-align: center;
}
.toast.err { background: var(--warn); color: #fff; }
.fatal { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink); }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { height: auto; display: block; }
  .main { display: block; }
  .stage { height: 62vh; min-height: 340px; }
  .panel { border-right: 0; overflow: visible; }
  .hud-bl { font-size: 10.5px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Terrain Forge</h1><span class="tag">Heightfield to GLB</span></div>
    <div class="actions">
      <button class="btn" id="btn-png" type="button">Heightmap PNG</button>
      <button class="btn primary" id="btn-glb" type="button">Export GLB</button>
    </div>
  </header>
  <div class="main">
    <aside class="panel" id="panel" aria-label="Map settings"></aside>
    <section class="stage" id="stage" aria-label="3D map preview">
      <div class="hud-tr">
        <button class="btn" id="btn-reset" type="button">Reset view</button>
        <button class="btn" id="btn-top" type="button">Top view</button>
      </div>
      <div class="hud-bl" id="stats">Building the first map&hellip;</div>
      <div class="busy" id="busy" hidden><span>Building terrain</span></div>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </section>
  </div>
</div>

  const waves = [[3, 2, 1, 0.3], [-5, 4, 0.6, 1.7], [7, -3, 0.4, 2.9], [2, 9, 0.3, 0.6], [11, 6, 0.2, 4.1], [-13, 8, 0.15, 5.2]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let h = 0; const u = x / S, v = y / S;
    for (const w of waves) h += w[2] * Math.sin(6.2831853 * (w[0] * u + w[1] * v) + w[3]);
    hgt[y * S + x] = h;
  }
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = hgt[y * S + ((x + 1) % S)] - hgt[y * S + ((x + S - 1) % S)], dy = hgt[((y + 1) % S) * S + x] - hgt[((y + S - 1) % S) * S + x];
    const nx = -dx * 0.9, ny = -dy * 0.9, nz = 1, l = Math.hypot(nx, ny, nz), o = (y * S + x) * 4;
    img.data[o] = (nx / l * 0.5 + 0.5) * 255; img.data[o + 1] = (ny / l * 0.5 + 0.5) * 255; img.data[o + 2] = (nz / l * 0.5 + 0.5) * 255; img.data[o + 3] = 255;
  }

const waterNormal = makeWaterNormal();

const contourU = { uContour: { value: 0 }, uInterval: { value: 20 } };
const terrainMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 });
terrainMat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, contourU);
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying float vY;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvY = position.y;');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vY;\nuniform float uContour;\nuniform float uInterval;')
    .replace('#include <color_fragment>', '#include <color_fragment>\nif (uContour > 0.5) { float q = vY / uInterval; float w = max(fwidth(q), 1e-4); float l = 1.0 - clamp(abs(fract(q - 0.5) - 0.5) / (w * 1.2), 0.0, 1.0); float major = step(mod(floor(q + 0.5), 5.0), 0.5); diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.06, 0.04, 0.03), l * (0.35 + 0.35 * major)); }');
};
terrainMat.customProgramCacheKey = () => 'tf-terrain-contour';
const baseMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0 });
const foliageMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, metalness: 0 });
const rockMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 });
const waterMat = new THREE.MeshStandardMaterial({ color: 0x2f7a96, transparent: true, opacity: 0.74, roughness: 0.1, metalness: 0, normalMap: waterNormal, depthWrite: false });
waterMat.normalScale.set(0.5, 0.5);

let M = { terrain: null, base: null, water: null, trees: null, rocks: null, towns: null };
let last = null;          // last generated bundle (geometries, palette, heights, params)
const cache = { key: null, H: null };
let framedFor = null;

function updateLighting() {

  const dir = new THREE.Vector3(Math.cos(e) * Math.sin(az), Math.sin(e), Math.cos(e) * Math.cos(az));
  const S = TF.smooth, mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  const night = { top: [6, 10, 26], hor: [24, 32, 54] }, dusk = { top: [52, 72, 130], hor: [236, 150, 104] }, day = { top: [58, 118, 200], hor: [178, 208, 232] };
  const a = S(-6, 14, el), b = S(6, 34, el);
  const top = mixc(mixc(night.top, dusk.top, a), day.top, b), hor = mixc(mixc(night.hor, dusk.hor, a), day.hor, b);
  const sunC = mixc([255, 160, 100], [255, 244, 228], S(2, 30, el));

  skyMat.uniforms.hor.value.set(hor[0] / 255, hor[1] / 255, hor[2] / 255);
  skyMat.uniforms.sunDir.value.copy(dir);
  skyMat.uniforms.sunCol.value.set(sunC[0] / 255, sunC[1] / 255, sunC[2] / 255).multiplyScalar(S(-4, 4, el));
  const toLin = c => new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255).convertSRGBToLinear();
  scene.fog.color.copy(toLin(hor));
  const size = V.size;
  scene.fog.near = size * 0.5; scene.fog.far = size * (9 - 7 * V.haze);
  sun.color.copy(toLin(sunC));
  sun.intensity = 1.35 * S(-3, 9, el);
  hemi.color.copy(toLin(mixc(hor, top, 0.6)));
  hemi.groundColor.set(0x5a5446).convertSRGBToLinear();
  hemi.intensity = 0.14 + 0.52 * S(-8, 18, el);
  const ctr = new THREE.Vector3(0, V.height * 0.25, 0);
  sun.position.copy(ctr).addScaledVector(dir, size * 1.6);
  sun.target.position.copy(ctr); sun.target.updateMatrixWorld();
  const sh = sun.shadow.camera, ext = size * 0.8;
  sh.left = -ext; sh.right = ext; sh.top = ext; sh.bottom = -ext; sh.near = size * 0.1; sh.far = size * 4; sh.updateProjectionMatrix();
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = Math.max(0.3, size / V.res * 0.2);
  sun.castShadow = !!V.shadows && el > -2;
  if (M.water) M.water.visible = !!V.waterOn;
  if (M.trees) M.trees.visible = !!V.treesOn;
  if (M.rocks) M.rocks.visible = !!V.rocksOn;
  if (M.towns) M.towns.visible = !!V.townsOn;
  terrainMat.wireframe = !!V.wire;

  controls.autoRotate = !!V.spin && !reduceMotion;
}
function frameCamera(top) {
  const s = V.size, h = V.height;
  if (top) camera.position.set(0, s * 1.15, s * 0.02); else camera.position.set(s * 0.78, s * 0.42 + h * 0.5, s * 0.98);
  controls.target.set(0, h * 0.2, 0);
  camera.near = Math.max(0.5, s * 0.004); camera.far = s * 40; camera.updateProjectionMatrix();
  controls.minDistance = s * 0.03; controls.maxDistance = s * 5;

}
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

let lastT = performance.now();
renderer.setAnimationLoop(t => {
  const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
  if (!reduceMotion) { waterNormal.offset.x += dt * 0.012; waterNormal.offset.y += dt * 0.007; }
  skyMesh.position.copy(camera.position);
  controls.update();
  renderer.render(scene, camera);
});

/* ---------- generation ---------- */
let busy = false, again = false;
function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, err ? 6000 : 3500);
}
const fmtN = n => n.toLocaleString('en-US');
function dispose(m) { if (m) { scene.remove(m); m.geometry.dispose(); } }
function install(out, P) {
  ['terrain', 'base', 'water', 'trees', 'rocks', 'towns'].forEach(k => { dispose(M[k]); M[k] = null; });
  const mk = (geo, mat, name, cast, recv) => { if (!geo) return null; const m = new THREE.Mesh(geo, mat); m.name = name; m.castShadow = cast; m.receiveShadow = recv; scene.add(m); return m; };
  M.terrain = mk(out.geos.terrain, terrainMat, 'Terrain', true, true);
  M.base = mk(out.geos.base, baseMat, 'Base', false, true);
  waterMat.color.set(out.pal.water).convertSRGBToLinear();
  M.water = mk(out.geos.water, waterMat, 'Water', false, false);
  M.trees = mk(out.geos.trees, foliageMat, 'Trees', true, true);
  M.rocks = mk(out.geos.rocks, rockMat, 'Boulders', true, true);
  M.towns = mk(out.geos.towns, foliageMat, 'Towns', true, true);
  contourU.uInterval.value = P.height < 150 ? 10 : P.height < 400 ? 20 : 50;
  last = { out, P };
  const key = P.size + '|' + P.height + '|' + P.preset;
  if (framedFor !== key) { frameCamera(false); framedFor = key; }
  updateLighting();
}
function params() {
  const P = Object.assign({}, V);
  P.res = V.res | 0;
  return P;
}
async function regenerate() {
  if (busy) { again = true; return; }
  busy = true; $('busy').hidden = false; $('btn-glb').disabled = true;
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 20)));
  try {
    const P = params(), t0 = performance.now();
    const out = TF.generate(P, cache);
    install(out, P);
    const ms = Math.round(performance.now() - t0), i = out.info;
    $('stats').innerHTML =
      '<b>' + fmtN(i.verts) + '</b> terrain verts &middot; <b>' + fmtN(i.tris) + '</b> tris<br>' +
      '<b>' + fmtN(i.trees) + '</b> trees &middot; <b>' + fmtN(i.rocks) + '</b> boulders &middot; <b>' + i.towns + '</b> towns (' + fmtN(i.houses) + ' buildings)<br>' +
      'relief 0&ndash;' + Math.round(i.hmax) + ' m &middot; sea ' + (P.sea > 0.001 ? Math.round(i.seaY) + ' m' : 'none') + '<br>' +
      (P.size / 1000).toFixed(2) + ' km wide &middot; GLB &asymp; ' + (i.bytes / 1048576).toFixed(1) + ' MB &middot; built in ' + ms + ' ms';
  } catch (err) {
    console.error(err); toast('Could not build the map: ' + err.message, true);
  }
  busy = false; $('busy').hidden = true; $('btn-glb').disabled = false;
  if (again) { again = false; regenerate(); }
}
let timer = null;
const schedule = () => { clearTimeout(timer); timer = setTimeout(regenerate, 40); };

/* ---------- panel events ---------- */
buildPanel();
panel.addEventListener('input', e => {
  const t = e.target; if (!t.id || !META[t.id]) return;
  if (META[t.id].kind === 'range' || META[t.id].kind === 'toggle') readValue(t);
  refreshOuts();
  if (LIVE.has(t.id)) updateLighting();
});
panel.addEventListener('change', e => {
  const t = e.target; if (!t.id || !META[t.id]) return;
  readValue(t); refreshOuts();
  if (LIVE.has(t.id) || NOREGEN.has(t.id)) { updateLighting(); return; }
  schedule();
});
panel.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) { applyPreset(chip.dataset.preset); return; }
  if (e.target.id === 'dice') { setValue('seed', Math.random().toString(36).slice(2, 8)); schedule(); }
});
function applyPreset(name) {
  const p = TF.PRESETS[name]; if (!p) return;
  V.preset = name; Object.assign(V, p.v);
  syncAll(); schedule();
}
$('btn-reset').addEventListener('click', () => frameCamera(false));
$('btn-top').addEventListener('click', () => frameCamera(true));

/* ---------- export ---------- */
let dlNs;
async function getDownloads() {
  if (dlNs !== undefined) return dlNs;
  if (!(window.claude && typeof window.claude.use === 'function')) { dlNs = false; return dlNs; }
  try { dlNs = (await window.claude.use('downloads')) || null; } catch (e) { dlNs = null; }
  return dlNs;
}
async function saveBlob(name, blob) {
  const dl = await getDownloads();
  if (dl) {
    let data = blob, fname = name;
    if (/\.glb$/i.test(name)) {
      if (!window.JSZip) throw new Error('The zip library did not load');
      const z = new JSZip(); z.file(name, blob);
      data = await z.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
      fname = name.replace(/\.glb$/i, '.zip');
    }
    await dl.save({ filename: fname, data });
    return fname;
  }
  if (dl === null) throw new Error('Downloads are not available in this view. Open the page in a browser tab or use the standalone file.');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return name;
}
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24) || 'map';
function exportGLB() {
  return new Promise((resolve, reject) => {
    const { out, P } = last, g = out.geos, grp = new THREE.Group(); grp.name = 'TerrainForge';
    const add = (geo, mat, name) => { if (geo) { const m = new THREE.Mesh(geo, mat); m.name = name; grp.add(m); } };
    const std = (name, extra) => Object.assign(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0, name }), extra || {});
    if (V.xTerrain) add(g.terrain, std('Terrain'), 'Terrain');
    if (V.xBase) add(g.base, std('Base', { roughness: 1 }), 'Base');
    if (V.xWater && g.water) {
      const wm = new THREE.MeshStandardMaterial({ color: new THREE.Color(out.pal.water).convertSRGBToLinear(), transparent: true, opacity: 0.74, roughness: 0.1, metalness: 0, name: 'Water' });
      const wg = g.water.clone(); wg.deleteAttribute('uv');
      add(wg, wm, 'Water');
    }
    if (V.xTrees) add(g.trees, std('Foliage', { roughness: 0.9 }), 'Trees');
    if (V.xRocks) add(g.rocks, std('Boulders'), 'Boulders');
    if (V.xTowns) add(g.towns, std('Buildings'), 'Towns');
    if (!grp.children.length) { reject(new Error('Nothing selected to export. Tick at least one part.')); return; }
    new THREE.GLTFExporter().parse(grp, res => resolve(new Blob([res], { type: 'model/gltf-binary' })), err => reject(err instanceof Error ? err : new Error('Export failed')), { binary: true, onlyVisible: false });
  });
}
async function run(btn, label, fn) {
  if (!last) return;
  const old = btn.textContent; btn.disabled = true; btn.textContent = label;
  try { const name = await fn(); if (name) toast('Saved ' + name); }
  catch (e) { if (e && e.code === 'declined') toast('Save cancelled'); else toast((e && e.message) || 'Export failed', true); }
  btn.disabled = false; btn.textContent = old;
}
$('btn-glb').addEventListener('click', () => run($('btn-glb'), 'Exporting…', async () => {
  const blob = await exportGLB();
  return saveBlob('terrain-' + slug(last.P.seed) + '-' + last.P.res + '.glb', blob);
}));
$('btn-png').addEventListener('click', () => run($('btn-png'), 'Saving…', async () => {
  const { out, P } = last, N = P.res, cv = document.createElement('canvas'); cv.width = cv.height = N;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(N, N);
  let mx = 1e-6; for (let i = 0; i < out.H.length; i++) if (out.H[i] > mx) mx = out.H[i];
  for (let i = 0; i < out.H.length; i++) { const v = Math.round(out.H[i] / mx * 255), o = i * 4; img.data[o] = img.data[o + 1] = img.data[o + 2] = v; img.data[o + 3] = 255; }
  ctx.putImageData(img, 0, 0);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  return saveBlob('heightmap-' + slug(P.seed) + '-' + N + '.png', blob);
}));

/* ---------- boot ---------- */
syncAll();
resize();
regenerate();
})();
</script>
