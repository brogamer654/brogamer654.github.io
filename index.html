<!DOCTYPE html>
<html>
<head>
  <title>3D FPS Potato Shooter - Grenade Update</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
      
    body { 
      margin: 0; 
      overflow: hidden; 
      background-color: #87ceeb; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    
    /* Pause / Shop Screen */
    #blocker {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 10;
    }
    #instructions {
      text-align: center;
      cursor: pointer;
      margin-bottom: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      border: 2px solid #2ecc71;
    }
    
    /* Shop UI */
    #shop {
      background: #2c3e50;
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #f39c12;
      text-align: center;
      width: 450px;
    }
    .shop-btn {
      background-color: #e67e22;
      color: white;
      border: none;
      padding: 10px;
      margin: 5px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }
    .shop-btn:hover { background-color: #d35400; }
    .shop-btn:disabled { background-color: #7f8c8d; cursor: not-allowed; }
    
    /* Crosshair */
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      pointer-events: none;
    }
    
    /* Top Left HUD */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
      z-index: 5;
      pointer-events: none;
    }
    
    /* Right Side Weapon Text */
    #weapon-hud {
      position: absolute;
      bottom: 100px;
      right: 20px;
      color: #f39c12;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
      z-index: 5;
      text-align: right;
    }

    /* 5-Slot Inventory Hotbar */
    #inventory-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 5;
    }
    .slot {
      width: 65px;
      height: 65px;
      background: rgba(0, 0, 0, 0.6);
      border: 3px solid #7f8c8d;
      border-radius: 8px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
      white-space: pre-wrap;
      box-shadow: 0 4px 6px rgba(0,0,0,0.5);
    }
    .slot.active {
      border-color: #f1c40f; 
      background: rgba(241, 196, 15, 0.2);
      transform: scale(1.1); 
    }
    .slot-num {
      position: absolute;
      top: 2px;
      left: 5px;
      font-size: 10px;
      color: #bdc3c7;
    }
  </style>
</head>
<body>

  <div id="hud">
    Points: <span id="score">0</span> | Health: <span id="health">100</span><br>
    <span style="font-size: 16px; color: #bdc3c7;">Press ESC to open Shop</span>
  </div>
  
  <div id="weapon-hud"><span id="current-weapon-name">Standard Spud</span></div>

  <div id="inventory-bar">
    <div class="slot active" id="slot-0"><span class="slot-num">1</span><span id="slot-text-0">Std</span></div>
    <div class="slot" id="slot-1"><span class="slot-num">2</span><span id="slot-text-1">-</span></div>
    <div class="slot" id="slot-2"><span class="slot-num">3</span><span id="slot-text-2">-</span></div>
    <div class="slot" id="slot-3"><span class="slot-num">4</span><span id="slot-text-3">-</span></div>
    <div class="slot" id="slot-4"><span class="slot-num">5</span><span id="slot-text-4">-</span></div>
  </div>

  <div id="blocker">
    <div id="instructions">
      <h1 style="font-size: 35px; margin: 0; color: #2ecc71;">Click to Play</h1>
      <p>Move: <strong>W A S D</strong> | Jump: <strong>Space</strong> | Shoot: <strong>Click</strong> | Switch Weapon: <strong>1-5</strong></p>
    </div>
    
    <div id="shop">
      <h2 style="margin-top: 0; color: #f39c12;">🛒 Spud Shop 🛒</h2>
      <p>Available Points: <strong id="shop-points">0</strong></p>
      <button class="shop-btn" id="btn-rapid">Buy Rapid-Fire Launcher (50 pts)</button>
      <button class="shop-btn" id="btn-shotgun">Buy Spud Shotgun (100 pts)</button>
      <button class="shop-btn" id="btn-sniper">Buy Spud Sniper (150 pts)</button>
      <button class="shop-btn" id="btn-cannon">Buy Spud Cannon (200 pts)</button>
      <button class="shop-btn" id="btn-mega" style="background-color: #8e44ad;">Buy Mega Spud (300 pts)</button>
      <!-- NEW GRENADE LAUNCHER BUTTON -->
      <button class="shop-btn" id="btn-grenade" style="background-color: #c0392b;">Buy Spud-Nade Launcher (400 pts)</button>
    </div>
  </div>

  <div class="crosshair"></div>

  <script>
    // 1. Scene, Camera, Rendering
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x556b2f);
    scene.fog = new THREE.Fog(0x556b2f, 10, 80);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.y = 2;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(500, 500),
      new THREE.MeshLambertMaterial({ color: 0x2d4d1e })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    for(let i = 0; i < 120; i++) {
       const tree = new THREE.Mesh(
         new THREE.CylinderGeometry(0.5, 0.5, 5),
         new THREE.MeshLambertMaterial({color: 0x4a2e12})
       );
       tree.position.set((Math.random() - 0.5) * 200, 2.5, (Math.random() - 0.5) * 200);
       scene.add(tree);
    }

    const controls = new THREE.PointerLockControls(camera, document.body);
    const blocker = document.getElementById('blocker');
    const instructions = document.getElementById('instructions');

    instructions.addEventListener('click', () => controls.lock());
    controls.addEventListener('lock', () => blocker.style.display = 'none');
    controls.addEventListener('unlock', () => {
      blocker.style.display = 'flex';
      document.getElementById('shop-points').innerText = score; 
    });
    scene.add(controls.getObject());

    // The standard cylinder gun (for standard, rapid, shotgun, sniper, cannon)
    const gun = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.08, 0.8),
      new THREE.MeshLambertMaterial({ color: 0x333333 })
    );
    gun.rotation.x = Math.PI / 2;
    gun.position.set(0.3, -0.25, -0.6);
    camera.add(gun);

    // NEW: Load your custom Grenade Launcher GLB!
    let customLauncher = null;
    const loader = new THREE.GLTFLoader();
    
    loader.load('https://brogamer654.github.io/scene.glb', function(gltf) {
      customLauncher = gltf.scene;
      
      // NOTE: 3D models from the internet are often HUGE or face the wrong way!
      // You might need to change these numbers to make it fit perfectly in your hands.
      customLauncher.scale.set(0.1, 0.1, 0.1); 
      customLauncher.position.set(0.3, -0.25, -0.6);
      
      // customLauncher.rotation.y = Math.PI; // Uncomment and tweak this if it points backwards
      
      customLauncher.visible = false; // Hide it until we equip it
      camera.add(customLauncher);
    }, undefined, function (error) {
      console.error('Error loading the 3D model:', error);
    });

    let score = 0;
    let health = 100;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();
    let clock = new THREE.Clock();

    // 4. Weapon Database & Inventory
    const weaponsDB = {
      standard: { id: "standard", name: "Standard Spud", cooldown: 30, pellets: 1, spread: 0, speed: 3.0, size: 0.12, short: "Std" },
      rapid:    { id: "rapid",    name: "Rapid-Fire",  cooldown: 8,  pellets: 1, spread: 0.02, speed: 3.5, size: 0.10, short: "Rapid" },
      shotgun:  { id: "shotgun",  name: "Spud Shotgun",cooldown: 50, pellets: 5, spread: 0.15, speed: 2.5, size: 0.08, short: "Shot" },
      sniper:   { id: "sniper",   name: "Spud Sniper", cooldown: 60, pellets: 1, spread: 0,    speed: 8.0, size: 0.15, short: "Snipe" },
      cannon:   { id: "cannon",   name: "Spud Cannon", cooldown: 80, pellets: 1, spread: 0,    speed: 1.5, size: 0.40, short: "Cannon"},
      mega:     { id: "mega",     name: "Mega Spud",   cooldown: 100, pellets: 1, spread: 0, speed: 4.0, size: 1.2, short: "MEGA" },
      grenade:  { id: "grenade",  name: "Spud-Nade",   cooldown: 90, pellets: 1, spread: 0, speed: 2.5, size: 0.25, short: "Nade" } // NEW GRENADE LAUNCHER
    };
    
    const inventory = [weaponsDB.standard, null, null, null, null];
    let activeSlotIndex = 0;
    
    function getActiveWeapon() {
      return inventory[activeSlotIndex];
    }

    function updateInventoryUI() {
      for (let i = 0; i < 5; i++) {
        const slotEl = document.getElementById(`slot-${i}`);
        const textEl = document.getElementById(`slot-text-${i}`);
        slotEl.className = i === activeSlotIndex ? 'slot active' : 'slot';
        textEl.innerText = inventory[i] ? inventory[i].short : "-";
      }
      
      const currentWeapon = getActiveWeapon();
      const currentWeaponName = currentWeapon ? currentWeapon.name : "Empty Hands";
      document.getElementById('current-weapon-name').innerText = currentWeaponName;
      document.getElementById('score').innerText = score;
      document.getElementById('shop-points').innerText = score;

      // NEW: Swap the 3D models!
      if (currentWeapon && currentWeapon.id === "grenade") {
        gun.visible = false; // Hide cylinder
        if (customLauncher) customLauncher.visible = true; // Show custom GLB
      } else {
        gun.visible = true; // Show cylinder
        if (customLauncher) customLauncher.visible = false; // Hide custom GLB
      }
    }

    function buyItem(itemObj, cost, btnId) {
      if (score >= cost) {
        const emptyIndex = inventory.indexOf(null); 
        if (emptyIndex !== -1) {
          score -= cost;
          inventory[emptyIndex] = itemObj;
          const btn = document.getElementById(btnId);
          btn.innerText = "BOUGHT";
          btn.disabled = true;
          updateInventoryUI();
        } else {
          alert("Your inventory is full!");
        }
      }
    }

    document.getElementById('btn-rapid').addEventListener('click', () => buyItem(weaponsDB.rapid, 50, 'btn-rapid'));
    document.getElementById('btn-shotgun').addEventListener('click', () => buyItem(weaponsDB.shotgun, 100, 'btn-shotgun'));
    document.getElementById('btn-sniper').addEventListener('click', () => buyItem(weaponsDB.sniper, 150, 'btn-sniper'));
    document.getElementById('btn-cannon').addEventListener('click', () => buyItem(weaponsDB.cannon, 200, 'btn-cannon'));
    document.getElementById('btn-mega').addEventListener('click', () => buyItem(weaponsDB.mega, 300, 'btn-mega'));
    document.getElementById('btn-grenade').addEventListener('click', () => buyItem(weaponsDB.grenade, 400, 'btn-grenade')); // NEW BTN

    document.addEventListener('keydown', (event) => {
      switch (event.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyD': moveRight = true; break;
        case 'Space': if (canJump) velocity.y += 12; canJump = false; break;
        case 'Digit1': activeSlotIndex = 0; updateInventoryUI(); break;
        case 'Digit2': activeSlotIndex = 1; updateInventoryUI(); break;
        case 'Digit3': activeSlotIndex = 2; updateInventoryUI(); break;
        case 'Digit4': activeSlotIndex = 3; updateInventoryUI(); break;
        case 'Digit5': activeSlotIndex = 4; updateInventoryUI(); break;
      }
    });

    document.addEventListener('keyup', (event) => {
      switch (event.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyD': moveRight = false; break;
      }
    });

    // 5. Shooting Mechanics
    let weaponTimer = 0;
    let isShooting = false;
    const potatoes = [];
    const healthDrops = [];
    const explosions = []; // NEW: Array for explosion visuals
    
    document.addEventListener('mousedown', () => isShooting = true);
    document.addEventListener('mouseup', () => isShooting = false);
    
    function fireWeapon() {
      const weapon = getActiveWeapon();
      if (!weapon || weaponTimer > 0) return; 

      for (let i = 0; i < weapon.pellets; i++) {
        const potato = new THREE.Mesh(
          new THREE.SphereGeometry(weapon.size, 8, 8), 
          new THREE.MeshLambertMaterial({ color: 0xb58342 })
        );
        
        const gunTip = new THREE.Vector3(0.3, -0.25, -0.8);
        gunTip.applyMatrix4(camera.matrixWorld);
        potato.position.copy(gunTip);

        const aimDirection = new THREE.Vector3();
        camera.getWorldDirection(aimDirection);
        
        aimDirection.x += (Math.random() - 0.5) * weapon.spread;
        aimDirection.y += (Math.random() - 0.5) * weapon.spread;
        aimDirection.z += (Math.random() - 0.5) * weapon.spread;
        
        // NEW: Grenade specific logic
        if (weapon.id === "grenade") {
          aimDirection.y += 0.2; // Aim slightly upwards for an arc
          potato.material.color.setHex(0x333333); // Dark iron-like color
          potato.userData.isGrenade = true; 
        }

        aimDirection.normalize(); 
        potato.userData.velocity = aimDirection.multiplyScalar(weapon.speed);
        potato.userData.life = 100;
        potato.userData.damage = weapon.id === "mega" ? 15 : (weapon.id === "cannon" ? 5 : (weapon.id === "sniper" ? 3 : 1));

        scene.add(potato);
        potatoes.push(potato);
      }
      
      weaponTimer = weapon.cooldown;
    }

    // 6. Zombie Spawner
    const zombies = [];
    function createZombie() {
      const zombieGroup = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 0.6), new THREE.MeshLambertMaterial({ color: 0x2e5a27 }));
      body.position.y = 1;
      zombieGroup.add(body);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshLambertMaterial({ color: 0x3d7a34 }));
      head.position.y = 2.4;
      zombieGroup.add(head);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.1), eyeMat);
      eye1.position.set(-0.2, 2.5, 0.4);
      const eye2 = eye1.clone();
      eye2.position.x = 0.2;
      zombieGroup.add(eye1);
      zombieGroup.add(eye2);

      const angle = Math.random() * Math.PI * 2;
      const radius = 30 + Math.random() * 20;
      const playerPos = controls.getObject().position;
      zombieGroup.position.set(playerPos.x + Math.sin(angle) * radius, 0, playerPos.z + Math.cos(angle) * radius);
      
      const speedBoost = Math.min(score / 100, 2.5); 
      zombieGroup.userData = { speed: 2.0 + Math.random() * 1.5 + speedBoost, hitCooldown: 0, hp: 2 + Math.floor(score/100) }; 
      scene.add(zombieGroup);
      zombies.push(zombieGroup);
    }

    for (let i = 0; i < 5; i++) createZombie();
    setInterval(() => {
      if (controls.isLocked && zombies.length < 35 && health > 0) createZombie();
    }, 1500);

    // 7. Main Loop
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (controls.isLocked && health > 0) {
        
        if (isShooting) fireWeapon();
        if (weaponTimer > 0) weaponTimer--;

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;
        velocity.y -= 30.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 90.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 90.0 * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);
        controls.getObject().position.y += (velocity.y * delta);

        if (controls.getObject().position.y < 2) {
          velocity.y = 0;
          controls.getObject().position.y = 2;
          canJump = true;
        }

        const playerPos = controls.getObject().position;

        // Animate Visual Explosions
        for (let i = explosions.length - 1; i >= 0; i--) {
          const exp = explosions[i];
          exp.life -= 1;
          exp.mesh.scale.addScalar(0.4); // Expand quickly
          exp.mesh.material.opacity -= 0.05; // Fade out
          if (exp.life <= 0) {
            scene.remove(exp.mesh);
            explosions.splice(i, 1);
          }
        }

        for (let i = healthDrops.length - 1; i >= 0; i--) {
          const drop = healthDrops[i];
          drop.rotation.y += 3 * delta;
          drop.rotation.x += 1 * delta;
          
          if (drop.position.distanceTo(playerPos) < 2) {
            health = Math.min(100, health + 25);
            document.getElementById('health').innerText = health;
            scene.remove(drop);
            healthDrops.splice(i, 1);
          }
        }

        for (let i = zombies.length - 1; i >= 0; i--) {
          const zombie = zombies[i];
          zombie.lookAt(playerPos.x, zombie.position.y, playerPos.z);
          zombie.translateZ(zombie.userData.speed * delta);

          if (zombie.position.distanceTo(playerPos) < 1.5 && zombie.userData.hitCooldown <= 0) {
            health -= 10;
            document.getElementById('health').innerText = Math.max(0, health);
            zombie.userData.hitCooldown = 60; 
            
            if (health <= 0) {
              alert("Game Over! Final Score: " + score);
              location.reload();
            }
          }
          if (zombie.userData.hitCooldown > 0) zombie.userData.hitCooldown--;
        }

        for (let i = potatoes.length - 1; i >= 0; i--) {
          const p = potatoes[i];
          
          // Apply gravity if it's a grenade
          if (p.userData.isGrenade) {
            p.userData.velocity.y -= 8.0 * delta; 
          }

          p.position.add(p.userData.velocity);
          p.userData.life--;

          let hit = false;
          
          // Grenades blow up when they touch the ground
          if (p.userData.isGrenade && p.position.y <= p.geometry.parameters.radius) {
            hit = true;
          }

          // Check Zombie Collisions
          if (!hit) {
            for (let j = zombies.length - 1; j >= 0; j--) {
              const z = zombies[j];
              if (p.position.distanceTo(z.position.clone().add(new THREE.Vector3(0, 1.2, 0))) < 1.5) {
                
                // Normal weapons deal direct damage
                if (!p.userData.isGrenade) {
                  z.userData.hp -= p.userData.damage; 
                  if (z.userData.hp <= 0) {
                    scene.remove(z);
                    zombies.splice(j, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;

                    if (Math.random() < 0.2) {
                      const medkit = new THREE.Mesh(
                        new THREE.BoxGeometry(0.8, 0.8, 0.8),
                        new THREE.MeshLambertMaterial({ color: 0xff3333 })
                      );
                      medkit.position.copy(z.position);
                      medkit.position.y = 0.4;
                      scene.add(medkit);
                      healthDrops.push(medkit);
                    }
                  }
                }
                hit = true;
                break; 
              }
            }
          }

          if (hit || p.userData.life <= 0) {
            
            // GRENADE AREA OF EFFECT EXPLOSION
            if (p.userData.isGrenade && hit) {
              // Create visual blast sphere
              const boom = new THREE.Mesh(
                new THREE.SphereGeometry(3, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.8 })
              );
              boom.position.copy(p.position);
              scene.add(boom);
              explosions.push({ mesh: boom, life: 15 });

              // Damage all nearby zombies
              for (let j = zombies.length - 1; j >= 0; j--) {
                const z = zombies[j];
                if (boom.position.distanceTo(z.position) < 4.5) { // Blast Radius
                  z.userData.hp -= 20; // Massive Explosion Damage
                  
                  if (z.userData.hp <= 0) {
                    scene.remove(z);
                    zombies.splice(j, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;

                    if (Math.random() < 0.2) {
                      const medkit = new THREE.Mesh(
                        new THREE.BoxGeometry(0.8, 0.8, 0.8),
                        new THREE.MeshLambertMaterial({ color: 0xff3333 })
                      );
                      medkit.position.copy(z.position);
                      medkit.position.y = 0.4;
                      scene.add(medkit);
                      healthDrops.push(medkit);
                    }
                  }
                }
              }
            }

            scene.remove(p);
            potatoes.splice(i, 1);
          }
        }
      }
      renderer.render(scene, camera);
    }

    animate();
    updateInventoryUI();

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
